# Two workflows in one file:
#   Local dev (host-run engine, local DB in Docker via the `local` profile):
#     docker compose --profile local up -d tiger
#     export TIGER_DATABASE_URL='postgres://orbital:orbital@localhost:5432/orbital'
#   Full stack (Coolify, or local full-stack run against Tiger Cloud):
#     docker compose up -d        # TIGER_DATABASE_URL must be set in the env
services:
  tiger:
    # Local-dev only; Coolify prod uses Tiger Cloud (TIGER_DATABASE_URL from env).
    profiles: ["local"]
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital
      POSTGRES_DB: orbital
    ports:
      - "5432:5432"
    volumes:
      - tiger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      NODE_ENV: production
      ENGINE_PORT: 8080
      TIGER_DATABASE_URL: ${TIGER_DATABASE_URL}
      # Gemini agents: decision-1 for choices, Flash fallback. Unset key = RandomValidPolicy, no calls.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GATEWAY_PROFILE: ${GATEWAY_PROFILE:-}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD:-15}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      LEDGER: ${LEDGER:-solana}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://solana-test-validator:8899}
      SOLANA_ADMIN_KEYPAIR: ${SOLANA_ADMIN_KEYPAIR:-}
      # Single local validator: nothing to roll back, so don't wait for votes. Use confirmed against devnet.
      SOLANA_COMMITMENT: ${SOLANA_COMMITMENT:-processed}
    expose:
      - "8080"
    depends_on:
      solana-test-validator:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Same origin: Caddy in the web image proxies /ws to the engine.
        VITE_ENGINE_WS_URL: /ws
        # Build-time Auth0 for the SPA. Must pair with AUTH0_ISSUER / AUTH0_AUDIENCE on the engine: if the engine
        # checks tokens and these are empty, the browser connects anonymously and every socket is refused (401).
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-${AUTH0_AUDIENCE:-}}
    environment:
      # Coolify replaces SERVICE_FQDN_WEB_80 with the public FQDN it assigns.
      SERVICE_FQDN_WEB_80:
    expose:
      - "80"
    depends_on:
      engine:
        condition: service_started
    restart: unless-stopped

  solana-test-validator:
    # Builds the Orbital program and runs a fresh (--reset) local chain with it preloaded.
    # Restart it together with the engine: docker compose restart solana-test-validator engine
    build:
      context: .
      dockerfile: Dockerfile.solana
    expose:
      - "8899"
    restart: unless-stopped

volumes:
  tiger-data:
